    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Background image - fixed position behind everything */
        .body-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* ADD YOUR BACKGROUND IMAGE HERE - REPLACE THE URL BELOW */
            background-image: url("data:image/svg+xml;base64,YOUR_BACKGROUND_SVG_BASE64_HERE");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        /* Main container - contains logo, title, status */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            padding: 30px 30px 20px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            text-align: center;
            margin: 20px 20px 10px 20px;
        }

        /* Turnstile container - OUTSIDE .container, no border, stands alone */
        .turnstile-container {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            padding: 10px 30px 20px 30px;
            margin: 0 20px 20px 20px;
            background: transparent;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 12px 0;
            text-align: center;
            color: #1a237e;
            font-weight: 600;
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 15px;
            line-height: 1.6;
        }

        #cf-turnstile {
            display: flex;
            justify-content: center;
        }

        .status {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            min-height: 20px;
            font-weight: 500;
        }

        .error-message {
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 6px;
            padding: 12px 15px;
            margin-top: 15px;
            color: #c62828;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .footer-note {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 10px;
        }

        @media screen and (max-width: 480px) {
            .container {
                padding: 25px 20px 15px 20px;
                margin: 16px 16px 8px 16px;
                max-width: calc(100% - 32px);
            }
            .turnstile-container {
                padding: 5px 20px 15px 20px;
                margin: 0 16px 16px 16px;
                max-width: calc(100% - 32px);
            }
            h1 {
                font-size: 20px;
            }
        }

        @media print {
            .container {
                box-shadow: none;
                border: 1px solid #ccc;
                margin: 0 auto;
            }
            .turnstile-container {
                margin: 0 auto;
            }
            .body-bg {
                display: none;
            }
        }
    </style>
</head>
